name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          # compileSdk 37 requires the android-37 platform
          accept-android-sdk-licenses: true
          cmdline-tools: latest

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests + lint
        run: ./gradlew testDebugUnitTest lintDebug --console=plain

      - name: Screenshot regression (Roborazzi verify)
        # verifyRoborazziDebug is the plugin-provided task; it runs the screenshot tests in
        # verify mode against the recorded images (equivalent to -Proborazzi.test.verify=true).
        run: ./gradlew verifyRoborazziDebug --console=plain

      - name: Assemble release (R8)
        run: ./gradlew assembleRelease --console=plain

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/roborazzi/**
