name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests + lint
        run: ./gradlew testDebugUnitTest lintDebug --console=plain

      - name: Screenshot regression (Roborazzi verify)
        run: ./gradlew testDebugUnitTest --tests "com.example.ScreenshotAuditTest" -Proborazzi.test.verify=true --rerun --console=plain

      - name: Assemble release (R8)
        run: ./gradlew assembleRelease --console=plain

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/roborazzi/**
